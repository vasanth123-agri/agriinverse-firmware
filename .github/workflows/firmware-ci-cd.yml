name: Firmware CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - '*-v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (for PlatformIO)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            src/gateway/.pio
          key: pio-gateway-${{ runner.os }}-${{ hashFiles('src/gateway/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Inject AWS IoT credentials
        env:
          ROOT_CA: ${{ secrets.AWS_ROOT_CA_H }}
          CERTIFICATE: ${{ secrets.AWS_CERTIFICATE_H }}
          PRIVATE_KEY: ${{ secrets.AWS_PRIVATE_KEY_H }}
        run: |
          printf '%s' "$ROOT_CA" > src/gateway/src/root_ca.h
          printf '%s' "$CERTIFICATE" > src/gateway/src/certificate.h
          printf '%s' "$PRIVATE_KEY" > src/gateway/src/privatekey.h

      - name: Build gateway firmware
        working-directory: src/gateway
        run: pio run -e esp32dev

      - name: Rename artifact with version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          cp src/gateway/.pio/build/esp32dev/firmware.bin "dist/gateway-${GITHUB_REF_NAME}.bin"

      - name: Upload gateway artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: gateway-firmware-${{ github.sha }}
          path: src/gateway/.pio/build/esp32dev/firmware.bin
          retention-days: 14

      - name: Create GitHub Release with gateway firmware
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gateway-*.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-valve-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (for PlatformIO)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            src/valve_node/.pio
          key: pio-valve-${{ runner.os }}-${{ hashFiles('src/valve_node/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build valve node firmware
        working-directory: src/valve_node
        run: pio run -e esp32dev

      - name: Rename artifact with version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          cp src/valve_node/.pio/build/esp32dev/firmware.bin "dist/valve_node-${GITHUB_REF_NAME}.bin"

      - name: Upload valve node artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: valve-node-firmware-${{ github.sha }}
          path: src/valve_node/.pio/build/esp32dev/firmware.bin
          retention-days: 14

      - name: Create GitHub Release with valve node firmware
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/valve_node-*.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
