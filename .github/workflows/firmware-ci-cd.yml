name: Firmware CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - '*-v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (for PlatformIO)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Inject AWS IoT credentials
        env:
          ROOT_CA: ${{ secrets.AWS_ROOT_CA_H }}
          CERTIFICATE: ${{ secrets.AWS_CERTIFICATE_H }}
          PRIVATE_KEY: ${{ secrets.AWS_PRIVATE_KEY_H }}
        run: |
          mkdir -p src
          printf '%s' "$ROOT_CA" > src/root_ca.h
          printf '%s' "$CERTIFICATE" > src/certificate.h
          printf '%s' "$PRIVATE_KEY" > src/privatekey.h

      - name: Build firmware
        run: pio run -e gateway -e valve_node

      - name: Rename artifacts with version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          cp .pio/build/gateway/firmware.bin "dist/gateway-${GITHUB_REF_NAME}.bin"
          cp .pio/build/valve_node/firmware.bin "dist/valve_node-${GITHUB_REF_NAME}.bin"

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: .pio/build/**/firmware.bin
          retention-days: 14

      - name: Create GitHub Release with firmware .bin
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print OTA URLs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Gateway OTA url:"
          echo "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/gateway-${{ github.ref_name }}.bin"
          echo "Valve node OTA url:"
          echo "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/valve_node-${{ github.ref_name }}.bin"
