[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    vshymanskyy/TinyGSM @ ^0.11.7
    bblanchon/ArduinoJson @ ^6.21.3
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9

build_flags =
    -DCORE_DEBUG_LEVEL=3
