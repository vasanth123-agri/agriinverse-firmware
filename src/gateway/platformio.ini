; Dual-Node Sensor Gateway — ESP32 + A7670 + LoRa 433 + SSD1306 OLED
; AWS certs go in include/certificate.h, privatekey.h, root_ca.h
; (copy the *.example.h files; the real ones are gitignored)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    ; Pinned to a commit so a change in the fork can't silently break builds.
    ; Update the hash deliberately when you want a newer fork.
    https://github.com/lewisxhe/TinyGSM-fork.git#2b683fe
    bblanchon/ArduinoJson @ ^6.21.3
    sandeepmistry/LoRa @ ^0.8.0
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
